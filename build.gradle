plugins {
    id 'dev.bvengo.modkit.target'
}

// Preserve the existing archive names and publication coordinates.
modkit.archiveName = 'mineprevention'

publishing.publications.named('mavenJava') {
    artifactId = 'mineprevention'
}

// Retain the existing dependency scope and exclusions from the shared declaration.
def clientDependencies = configurations.clientImplementation.dependencies
def modMenu = clientDependencies.find { it.group == 'com.terraformersmc' && it.name == 'modmenu' }

clientDependencies.remove(modMenu)
dependencies.add('implementation', modMenu)
